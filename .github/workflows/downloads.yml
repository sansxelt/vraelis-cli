name: standalone downloads
# Builds the Vraelis Prompto standalone executables (no Python needed) from a release tag's source, smoke-tests each,
# and attaches them to that release with SHA256SUMS-downloads. Run by hand for a tag that already has a release.
# Unsigned: Windows shows "Unknown publisher" and macOS blocks the first open until code signing is set up.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.2"
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, ext: .exe }
          - { os: macos-14, target: macos-arm64, ext: "" }
          - { os: macos-15-intel, target: macos-x64, ext: "" }
          - { os: ubuntu-22.04, target: linux-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (packaging files from this branch)
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (the release's source)
        with:
          ref: ${{ inputs.tag }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: install pinned build tools (hash-checked)
        run: python -m pip install --require-hashes -r packaging/build-requirements.txt
      - name: build
        shell: bash
        run: |
          python -m PyInstaller --onefile --name vraelis --clean --noconfirm --paths src --collect-submodules vraelis packaging/prompto_launcher.py
      - name: smoke test
        shell: bash
        run: bash packaging/smoke.sh "dist/vraelis${{ matrix.ext }}"
      - name: package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"; mkdir out
          if [ "${{ matrix.ext }}" = ".exe" ]; then cp dist/vraelis.exe "out/vraelis-$V-${{ matrix.target }}.exe"
          else tar -czf "out/vraelis-$V-${{ matrix.target }}.tar.gz" -C dist vraelis; fi
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error
  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: checksums and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd out && sha256sum vraelis-* > SHA256SUMS-downloads && cat SHA256SUMS-downloads
          gh release upload "$TAG" vraelis-* SHA256SUMS-downloads --repo "$GITHUB_REPOSITORY" --clobber
