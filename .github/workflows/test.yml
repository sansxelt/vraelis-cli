name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -P -m unittest discover -s tests -v
      - name: ignore rules agree with git check-ignore
        run: python -I tests/ignore_vs_git.py --quick
      - name: build and install the wheel, then smoke-test the installed command
        shell: bash
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv "$RUNNER_TEMP/v"
          if [ -x "$RUNNER_TEMP/v/bin/python" ]; then VP="$RUNNER_TEMP/v/bin"; else VP="$RUNNER_TEMP/v/Scripts"; fi
          "$VP/python" -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/m" && printf 'x' > "$RUNNER_TEMP/m/model.safetensors"
          cd "$RUNNER_TEMP"
          "$VP/vraelis" --version
          "$VP/vraelis" models lock m
          "$VP/vraelis" models verify m
          printf 'y' > m/model.safetensors
          set +e; "$VP/vraelis" models verify m; rc=$?; set -e
          test "$rc" = 1
      - name: installed command in Windows CMD
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%"
          "%RUNNER_TEMP%\v\Scripts\vraelis.exe" --help > cmd-help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"assistant" cmd-help.txt > nul
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\v\Scripts\vraelis.exe" account --help > cmd-account-help.txt
          if errorlevel 1 exit /b 1
          findstr /C:"usage" cmd-account-help.txt > nul
          if errorlevel 1 exit /b 1
          mkdir cmd-model
          echo model> cmd-model\model.safetensors
          "%RUNNER_TEMP%\v\Scripts\vraelis.exe" models lock cmd-model
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\v\Scripts\vraelis.exe" models verify cmd-model
          if errorlevel 1 exit /b 1
