[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vraelis"
version = "0.1.0"
description = "Offline lockfiles for AI model folders and AI coding-agent add-ons: Unchanged / Changed / Can't verify"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/sansxelt/vraelis-cli"
Issues = "https://github.com/sansxelt/vraelis-cli/issues"
Changelog = "https://github.com/sansxelt/vraelis-cli/blob/main/CHANGELOG.md"

[project.optional-dependencies]
signature = ["model-signing==1.1.1"]

[project.scripts]
vraelis = "vraelis.cli:run"

[tool.setuptools]
packages = ["vraelis", "vraelis.models", "vraelis.agents"]
