name: Report acceptance
on:
  workflow_dispatch:
  push:
    branches: [work/cli-ci-reporting]
permissions:
  contents: read
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and install package
        run: python -m pip install .
      - name: Installed verification outcomes (offline)
        run: python -I scripts/ci_report_acceptance.py prepare --directory "${{ runner.temp }}/report-acceptance"
      - name: Verify live authentication refusal (no account credential)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: python -I scripts/ci_report_acceptance.py reject --directory "${{ runner.temp }}/report-acceptance" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Submit real-account reports (Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          VRAELIS_REPORT_TOKEN: ${{ secrets.VRAELIS_REPORT_TOKEN }}
        run: python -I scripts/ci_report_acceptance.py submit --directory "${{ runner.temp }}/report-acceptance" --run-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Keep acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-acceptance-${{ runner.os }}
          path: |
            ${{ runner.temp }}/report-acceptance/verification.json
            ${{ runner.temp }}/report-acceptance/reporting.json
          if-no-files-found: error
