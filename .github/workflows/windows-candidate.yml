name: windows candidate build
# A clean Windows build for testing only. It publishes nothing: read-only permission, no release job, no asset touched.
# The downloads workflow is not used because its attach job runs `gh release upload --clobber`.
on:
  push:
    branches: [candidate/windows-rebuild]
    paths: [.github/workflows/windows-candidate.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_TAG: v0.1.2
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (packaging files from this branch)
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (the release's source)
        with:
          ref: ${{ env.SOURCE_TAG }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.10"  # the version inside the published file, so any difference is not Python's
      - name: install pinned build tools (hash-checked)
        run: python -m pip install --require-hashes -r packaging/build-requirements.txt
      - name: build
        shell: bash
        run: python -m PyInstaller --onefile --name vraelis --clean --noconfirm --paths src --collect-submodules vraelis packaging/prompto_launcher.py
      - name: smoke test
        shell: bash
        run: bash packaging/smoke.sh dist/vraelis.exe
      - name: record the hash
        shell: bash
        run: sha256sum dist/vraelis.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-candidate
          path: dist/vraelis.exe
          retention-days: 7
          if-no-files-found: error
