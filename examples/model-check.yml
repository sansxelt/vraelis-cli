# Copy to .github/workflows only after providing a trusted built CLI wheel
# at dist/vraelis-*.whl and a model folder with its approved lockfile.
name: Model verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install approved CLI wheel
        run: python -m pip install --no-deps dist/vraelis-*.whl
      - name: Verify model (controls job outcome)
        id: verify
        run: vraelis models verify ./model --json > result.json
      - name: Submit optional account report
        if: ${{ always() && steps.verify.outcome != 'skipped' && hashFiles('result.json') != '' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          VRAELIS_REPORT_TOKEN: ${{ secrets.VRAELIS_REPORT_TOKEN }}
        run: vraelis report --file result.json --name my-model
